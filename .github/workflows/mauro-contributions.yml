name: MAURO contribution generator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mauro-contributions.yml'
      - '.github/scripts/mauro-contrib.sh'
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mauro-contributions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git author
        run: |
          git config user.name "mletelle"
          git config user.email "179537725+mletelle@users.noreply.github.com"

      - name: Generate MAURO contribution commit
        run: bash .github/scripts/mauro-contrib.sh

      - name: Push contribution commit
        run: |
          git push origin HEAD:main
