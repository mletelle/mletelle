name: MAURO contribution generator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git author
        run: |
          git config user.name "mletlle GitHub Action"
          git config user.email "mletlle@users.noreply.github.com"

      - name: Generate MAURO contribution commit
        run: bash .github/scripts/mauro-contrib.sh

      - name: Push contribution commit
        run: |
          git push origin HEAD
